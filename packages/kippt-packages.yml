note: >-
  Kippt (kippt.com) was a social bookmarking service that exposed a public REST
  API. The service has been discontinued and the domain no longer responds, but
  community-authored client libraries for that historical API remain published
  on the public registries. None are first-party — every one is a third-party
  wrapper authored by an individual developer, so all are recorded official:false.
