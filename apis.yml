name: Kippt
description: >-
  Kippt was a social bookmarking and link-saving service (kippt.com) that let
  people save, organize, and share bookmarks in lists and follow other users'
  collections. It exposed a public REST API over the kippt.com domain, which
  produced a small ecosystem of community-authored client libraries in Python,
  Ruby, and JavaScript. Kippt was surfaced as a portfolio company of a16z and
  added to the API Evangelist network as a stub for enrichment. The service has
  since been discontinued: the kippt.com domain resolves to a legacy IP but no
  longer responds, so there is no live developer portal, documentation, or API
  surface to harvest. What remains real and capturable is the set of third-party
  API wrapper packages still published on the public registries.
